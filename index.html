<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
:root{--bg:#f3f3f3;--card:#fff;--text:#1a1a1a;--sub:#605e5c;--line:#e5e5e5;--acc:#0067c0;--accbg:#e5f1fb}
@media (prefers-color-scheme:dark){:root{--bg:#202020;--card:#2b2b2b;--text:#fff;--sub:#a0a0a0;--line:#3a3a3a;--acc:#60cdff;--accbg:#0f3550}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:"Segoe UI Variable","Segoe UI",Tahoma,sans-serif;user-select:none;overflow:hidden}
h1{font-size:20px;font-weight:600;margin:0 4px 2px}
.sub{color:var(--sub);font-size:13px;margin:0 4px 16px}
.hero{background:var(--accbg);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;margin-bottom:14px}
.hero .l{font-size:13px;color:var(--sub)}.hero .n{font-size:22px;font-weight:600;color:var(--acc);margin:2px 0 6px}
.hero .c{font-size:44px;font-weight:300;direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:1px}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);font-size:16px;position:relative}
.row:last-child{border-bottom:0}
.row .t{direction:ltr;font-variant-numeric:tabular-nums;color:var(--sub)}
.row.next{background:var(--accbg);font-weight:600}.row.next .t{color:var(--acc)}
.row.next::before{content:"";position:absolute;right:0;top:25%;bottom:25%;width:4px;border-radius:2px;background:var(--acc)}
.row.past{opacity:.5}
.off{margin-top:12px;font-size:12px;color:var(--sub);text-align:center;min-height:16px}
</style></head><body>
<h1>مواقيت الصلاة</h1><div class="sub" id="date">الإسكندرية، مصر</div>
<div class="hero"><div class="l">الصلاة القادمة</div><div class="n" id="nn">--</div><div class="c" id="cd">--:--:--</div></div>
<div class="list" id="list"></div><div class="off" id="off"></div>
<script src="app.js"></script></body></html>
