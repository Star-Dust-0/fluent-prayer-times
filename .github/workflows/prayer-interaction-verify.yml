name: Prayer interaction verification (no release)
on:
  push:
    branches: [reverse-engineered-v1.3.6]
    paths: ['.github/workflows/prayer-interaction-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  interaction:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Download already verified portable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40762673696 --repo "$env:GITHUB_REPOSITORY" --name self-contained-verified --dir artifacts
          Expand-Archive artifacts/FluentPrayerTimes-v1.3.6-self-contained-portable-win-x64.zip app
      - name: Exercise actual converter and azkar navigation
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes,System.Windows.Forms,System.Drawing
          $settings="$env:APPDATA/FluentPrayerTimes"
          New-Item -ItemType Directory -Force $settings | Out-Null
          '{"Lang":"en","Theme":"dark","AutoUpdate":false,"LocationPending":false}' | Set-Content "$settings/settings.json"
          $p=Start-Process "$PWD/app/FluentPrayerTimes.exe" -PassThru
          Start-Sleep -Seconds 8
          $root=[System.Windows.Automation.AutomationElement]::RootElement
          $cond=New-Object System.Windows.Automation.PropertyCondition ([System.Windows.Automation.AutomationElement]::ProcessIdProperty),$p.Id
          $win=$root.FindFirst([System.Windows.Automation.TreeScope]::Children,$cond)
          if (-not $win) { throw 'Main app window missing' }
          $all=$win.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
          $all | ForEach-Object { $_.Current.Name } | Set-Content automation-names.txt
          foreach ($pair in @(@('Date converter','converter'),@('Azkar reminder','azkar'))) {
            $name=$pair[0];$file=$pair[1]
            $cond=New-Object System.Windows.Automation.PropertyCondition ([System.Windows.Automation.AutomationElement]::NameProperty),$name
            $el=$win.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$cond)
            if (-not $el) { throw "Navigation item missing: $name" }
            $el.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
            Start-Sleep -Seconds 3
            $bounds=$win.Current.BoundingRectangle
            $bmp=New-Object System.Drawing.Bitmap ([int]$bounds.Width),([int]$bounds.Height)
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen([int]$bounds.X,[int]$bounds.Y,0,0,$bmp.Size)
            $bmp.Save("$PWD/$file.png");$g.Dispose();$bmp.Dispose()
          }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prayer-interaction
          path: |
            converter.png
            azkar.png
            automation-names.txt
