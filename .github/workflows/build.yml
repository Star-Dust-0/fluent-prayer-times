name: Build and verify
on:
  push:
    branches: [main]
    paths: ['src/**', 'installer/**', 'verification/**', 'tests/**', '.github/workflows/build.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  FPT_E2E: '1'

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Read app version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/FluentPrayerTimes/FluentPrayerTimes.csproj
          "APP_VERSION=$($project.Project.PropertyGroup.Version)" >> $env:GITHUB_ENV
      - name: Resilience regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/Resilience/Resilience.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Resilience regression failed' }
      - name: Dependency security audit
        shell: pwsh
        run: |
          dotnet restore src/FluentPrayerTimes/FluentPrayerTimes.csproj
          dotnet list src/FluentPrayerTimes/FluentPrayerTimes.csproj package --vulnerable --include-transitive
      - name: Location regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/Location/Location.csproj | Tee-Object location-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Location tests failed' }
      - name: Build bundled Windows app
        id: build
        shell: pwsh
        run: |
          dotnet publish src/FluentPrayerTimes/FluentPrayerTimes.csproj -c Release -r win-x64 -p:Platform=x64 -p:PublishDir=../../publish/ -v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'VC runtime missing' }
          Copy-Item "$($crt.FullName)/*.dll" publish -Force
      - name: Compare unchanged calculation and formatting with published app
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/Star-Dust-0/fluent-prayer-times/releases/download/v1.3.7/FluentPrayerTimes-v1.3.7-portable-win-x64.zip' -OutFile baseline.zip
          Expand-Archive baseline.zip baseline -Force
          $original = Get-ChildItem baseline -Recurse -Filter FluentPrayerTimes.dll | Select-Object -First 1
          dotnet run --project tests/Parity/Parity.csproj -- $original.FullName "$PWD/publish/FluentPrayerTimes.dll" --calculation-only | Set-Content parity-results.json
          if ($LASTEXITCODE -ne 0) { throw 'Calculation parity failed' }
      - name: Self tests and actual location UI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./verification/location-ui.ps1
      - name: Static binding inventory
        shell: pwsh
        run: |
          python tests/Bindings/inventory.py | Set-Content proof/binding-inventory.json
          if ($LASTEXITCODE -ne 0) { throw 'Static binding audit failed' }
          python tests/Bindings/localization.py | Set-Content proof/localization-inventory.json
          if ($LASTEXITCODE -ne 0) { throw 'Missing localization keys' }
      - name: Calculation and countdown boundary matrix
        shell: pwsh
        run: |
          dotnet run --project tests/Calculation/Calculation.csproj -- proof/calculation-matrix.json
          if ($LASTEXITCODE -ne 0) { throw 'Calculation/state matrix failed' }
      - name: Live updater integrity, progress and cancellation tests
        shell: pwsh
        run: |
          $info=[System.Diagnostics.ProcessStartInfo]::new("$PWD/publish/FluentPrayerTimes.exe", '--update-e2e')
          $info.UseShellExecute=$false
          $p=[System.Diagnostics.Process]::Start($info)
          $p.WaitForExit()
          $p.Refresh()
          Copy-Item "$env:APPDATA/FluentPrayerTimes/update-e2e.log" proof/update-e2e.log
          if ($p.ExitCode -ne 0) { throw 'Live updater verification failed' }
      - name: Actual app-wide UI control audit
        shell: pwsh
        run: ./verification/control-audit.ps1
      - name: Countdown surfaces and actual notification gates
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./verification/countdown-audit.ps1
      - name: Conditional update controls
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./verification/update-controls.ps1
      - name: Lifecycle and production hook isolation
        shell: pwsh
        run: ./verification/lifecycle.ps1
      - name: Package three app builds
        shell: pwsh
        run: |
          Copy-Item LICENSE publish/LICENSE.txt
          Compress-Archive publish/* FluentPrayerTimes-v${{ env.APP_VERSION }}-portable-win-x64.zip
          Copy-Item installer/self-contained.iss self-contained.iss
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" /DAppVersion=$env:APP_VERSION self-contained.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
          Copy-Item out/*.exe .
          New-Item full -ItemType Directory | Out-Null
          Copy-Item publish full/App -Recurse
          Copy-Item out/*.exe full/
          Copy-Item LICENSE full/LICENSE.txt
          Compress-Archive full/* FluentPrayerTimes-v${{ env.APP_VERSION }}-full-win-x64.zip
      - name: Calculate package checksums
        shell: pwsh
        run: |
          Get-ChildItem FluentPrayerTimes-v* -File | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content SHA256SUMS.txt
      - name: Verify upgrade from published 1.3.6
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./verification/location-upgrade.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: review-verified
          path: |
            FluentPrayerTimes-v${{ env.APP_VERSION }}-*.zip
            FluentPrayerTimes-v${{ env.APP_VERSION }}-*.exe
            SHA256SUMS.txt
            parity-results.json
            proof/**
            location-tests.txt
