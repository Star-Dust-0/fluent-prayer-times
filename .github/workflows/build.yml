name: Build and verify
on:
  push:
    branches: [main, main]
    paths: ['src/**', 'installer/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaging:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish fully self-contained recovered source
        shell: pwsh
        run: |
          msbuild src/FluentPrayerTimes/FluentPrayerTimes.csproj /restore /t:Publish /p:Configuration=Release /p:RuntimeIdentifier=win-x64 /p:Platform=x64 /p:PublishDir=../../publish/ /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'App publish failed' }
          # Ship Microsoft's app-local VC runtime rather than installing a machine-wide redistributable.
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Microsoft app-local VC runtime not found' }
          Copy-Item "$($crt.FullName)/*.dll" publish -Force
      - name: Verify local dependencies and remove shared Windows App Runtime from test runner
        shell: pwsh
        run: |
          $config = Get-Content publish/FluentPrayerTimes.runtimeconfig.json -Raw | ConvertFrom-Json
          if ($config.runtimeOptions.framework -or $config.runtimeOptions.frameworks) { throw 'Still depends on shared .NET' }
          foreach ($file in @('FluentPrayerTimes.exe','Microsoft.WinUI.dll','Microsoft.WindowsAppRuntime.dll','coreclr.dll','hostfxr.dll','vcruntime140.dll','msvcp140.dll')) {
            if (-not (Test-Path "publish/$file")) { throw "Missing bundled dependency: $file" }
          }
          Import-Module Appx -UseWindowsPowerShell
          Get-AppxPackage '*WindowsAppRuntime*' | Remove-AppxPackage -ErrorAction Stop
          if (Get-AppxPackage '*WindowsAppRuntime*') { throw 'Shared Windows App Runtime remains installed for runner user' }
          $env:DOTNET_MULTILEVEL_LOOKUP = '0'
          $env:DOTNET_ROOT = "$env:RUNNER_TEMP/no-shared-dotnet"
          New-Item -ItemType Directory -Force $env:DOTNET_ROOT | Out-Null
          $p = Start-Process "$PWD/publish/FluentPrayerTimes.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Self-contained launch failed: $($p.ExitCode)" }
          $local = (Resolve-Path publish).Path
          $modules = @($p.Modules | Where-Object { $_.ModuleName -match '^(coreclr|Microsoft.WinUI|Microsoft.WindowsAppRuntime|hostfxr)\.dll$' })
          foreach ($name in @('coreclr.dll','Microsoft.WinUI.dll','Microsoft.WindowsAppRuntime.dll')) {
            $module = $modules | Where-Object ModuleName -eq $name
            if (-not $module -or -not $module.FileName.StartsWith($local, [StringComparison]::OrdinalIgnoreCase)) { throw "Dependency not loaded locally: $name" }
          }
          $modules | Select-Object ModuleName,FileName | ConvertTo-Json | Set-Content dependency-proof.json
          Add-Type -AssemblyName System.Drawing,System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $bitmap.Save("$PWD/app-self-contained.png")
          $graphics.Dispose(); $bitmap.Dispose()
          Stop-Process -Id $p.Id -Force
      - name: Verify candidate updater against current public release
        shell: pwsh
        run: |
          $p=Start-Process "$PWD/publish/FluentPrayerTimes.exe" -ArgumentList '--update-e2e' -PassThru -Wait
          Copy-Item "$env:APPDATA/FluentPrayerTimes/update-e2e.log" candidate-update-e2e.log
          if ($p.ExitCode -ne 0) { throw 'Candidate updater failed' }
      - name: Package portable archive and per-user installer
        shell: pwsh
        run: |
          @'
          Fluent Prayer Times 1.3.6 - Windows x64
          Windows 10 version 1809 or later / Windows 11 (x64).
          Extract the entire ZIP before running FluentPrayerTimes.exe. Keep all files together.
          .NET, Windows App SDK, and VC runtime files are bundled. No runtime installation is required.
          The installer installs to Program Files and requires administrator rights.
          Existing downloads remain available separately.
          brought to you by Instinct - https://instinct.com
          '@ | Set-Content publish/README.txt -Encoding utf8
          Copy-Item LICENSE publish/LICENSE.txt
          Compress-Archive -Path publish/* -DestinationPath 'FluentPrayerTimes-v1.3.6-portable-win-x64.zip'
          Copy-Item installer/FluentPrayerTimes.iss FluentPrayerTimes.iss
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" /DAppVersion=1.3.6 FluentPrayerTimes.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Copy-Item out/*.exe .
      - name: Capture recovered installer UI
        shell: pwsh
        run: |
          $p = Start-Process './FluentPrayerTimes-v1.3.6-installer-win-x64.exe' -PassThru
          Start-Sleep -Seconds 5
          Add-Type -AssemblyName System.Drawing,System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $bitmap.Save("$PWD/installer-self-contained.png")
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
          $cond=New-Object System.Windows.Automation.PropertyCondition ([System.Windows.Automation.AutomationElement]::NameProperty),'Setup - Fluent Prayer Times'
          $window=[System.Windows.Automation.AutomationElement]::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Children,$cond)
          if (-not $window) { throw 'Setup wizard window missing' }
          $window.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition) | ForEach-Object { $_.Current.Name } | Set-Content installer-controls.txt
          $nextCondition=New-Object System.Windows.Automation.PropertyCondition ([System.Windows.Automation.AutomationElement]::NameProperty),'Next >'
          $next=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$nextCondition)
          $next.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          Start-Sleep -Seconds 2
          $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $bitmap.Save("$PWD/installer-tasks.png")
          $graphics.Dispose(); $bitmap.Dispose()
          Stop-Process -Id $p.Id -Force
      - name: Install published 1.3.6 for real upgrade test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.3.6 --repo "$env:GITHUB_REPOSITORY" --pattern '*-installer-win-x64.exe' --dir old
          $old = "$env:LOCALAPPDATA/Programs/FluentPrayerTimes-SelfContained"
          $p = Start-Process './old/FluentPrayerTimes-v1.3.6-installer-win-x64.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$old/FluentPrayerTimes.exe")) { throw 'Original 1.3.6 install failed' }
          $settings = "$env:APPDATA/FluentPrayerTimes/settings.json"
          '{"Lang":"en","Theme":"dark","AutoUpdate":false,"LocationPending":false}' | Set-Content $settings
          $p = Start-Process "$old/FluentPrayerTimes.exe" -PassThru
          Start-Sleep -Seconds 5
          (Get-FileHash $settings).Hash | Set-Content old-settings-hash.txt
      - name: Verify installer extraction and installed launch
        shell: pwsh
        run: |
          $p = Start-Process './FluentPrayerTimes-v1.3.6-installer-win-x64.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=packaging-install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $root = "$env:ProgramFiles/FluentPrayerTimes"
          if (-not (Test-Path "$root/FluentPrayerTimes.exe")) { throw 'Per-user install missing' }
          if (Test-Path "$env:LOCALAPPDATA/Programs/FluentPrayerTimes-SelfContained") { throw 'Old folder remains' }
          if (Test-Path 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/FluentPrayerTimes-SelfContained_is1') { throw 'Old uninstall registry entry remains' }
          $settings = "$env:APPDATA/FluentPrayerTimes/settings.json"
          if ((Get-FileHash $settings).Hash -ne (Get-Content old-settings-hash.txt)) { throw '1.3.6 upgrade changed settings' }
          foreach ($folder in @([Environment]::GetFolderPath('CommonPrograms'),[Environment]::GetFolderPath('CommonDesktopDirectory'))) {
            if (Test-Path "$folder/Fluent Prayer Times (Self-contained).lnk") { throw 'Old shortcut remains' }
            if (-not (Test-Path "$folder/Fluent Prayer Times.lnk")) { throw 'Plain shortcut missing' }
          }
          foreach ($folder in @([Environment]::GetFolderPath('Programs'),[Environment]::GetFolderPath('Desktop'))) {
            if (Test-Path "$folder/Fluent Prayer Times (Self-contained).lnk") { throw 'Old per-user shortcut remains' }
          }
          $entry=Get-ItemProperty 'HKLM:/Software/Microsoft/Windows/CurrentVersion/Uninstall/FluentPrayerTimes_is1'
          if ($entry.DisplayName -ne 'Fluent Prayer Times') { throw "Wrong display name: $($entry.DisplayName)" }
          $entry | Select-Object DisplayName,DisplayVersion,InstallLocation,UninstallString | ConvertTo-Json | Set-Content installed-entry.json
          $p = Start-Process "$root/FluentPrayerTimes.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "Installed launch failed: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Verify upgrade, shortcuts and uninstall preserve settings
        shell: pwsh
        run: |
          $root = "$env:ProgramFiles/FluentPrayerTimes"
          $settings = "$env:APPDATA/FluentPrayerTimes/settings.json"
          New-Item -ItemType Directory -Force (Split-Path $settings) | Out-Null
          '{"Lang":"en","Theme":"dark","AutoUpdate":false}' | Set-Content $settings
          $running = Start-Process "$root/FluentPrayerTimes.exe" -PassThru
          Start-Sleep -Seconds 5
          $hash = (Get-FileHash $settings).Hash
          $p = Start-Process './FluentPrayerTimes-v1.3.6-installer-win-x64.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=packaging-install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Upgrade failed: $($p.ExitCode)" }
          Get-Process FluentPrayerTimes -ErrorAction SilentlyContinue | Stop-Process -Force
          if ((Get-FileHash $settings).Hash -ne $hash) { throw 'Upgrade changed settings' }
          $programs = [Environment]::GetFolderPath('CommonPrograms')
          $desktop = [Environment]::GetFolderPath('CommonDesktopDirectory')
          foreach ($link in @("$programs/Fluent Prayer Times.lnk","$desktop/Fluent Prayer Times.lnk")) {
            if (-not (Test-Path $link)) { throw "Missing shortcut: $link" }
          }
          # Show actual installed shortcuts and Programs and Features entry.
          Start-Process explorer.exe -ArgumentList ([Environment]::GetFolderPath('CommonDesktopDirectory'))
          Start-Sleep -Seconds 4
          Add-Type -AssemblyName System.Drawing,System.Windows.Forms
          function Shot($name) {
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $im=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($im)
            $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
            $im.Save("$PWD/$name.png");$g.Dispose();$im.Dispose()
          }
          Shot 'installed-shortcut'
          Start-Process control.exe -ArgumentList 'appwiz.cpl'
          Start-Sleep -Seconds 5
          [System.Windows.Forms.SendKeys]::SendWait('Fluent Prayer Times')
          Shot 'installed-programs'
          $p = Start-Process "$root/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=packaging-install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed: $($p.ExitCode)" }
          if (Test-Path "$root/FluentPrayerTimes.exe") { throw 'App remains after uninstall' }
          if ((Get-FileHash $settings).Hash -ne $hash) { throw 'Uninstall removed settings' }
          'install, installed launch, upgrade, shortcuts, uninstall, settings retention: PASS' | Set-Content packaging-proof.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-contained-verified
          path: |
            FluentPrayerTimes-v1.3.6-portable-*.zip
            FluentPrayerTimes-v1.3.6-installer-*.exe
            app-self-contained.png
            installer-self-contained.png
            installer-tasks.png
            dependency-proof.json
            packaging-proof.txt
            candidate-update-e2e.log
            installed-entry.json
            installer-controls.txt
            installed-shortcut.png
            installed-programs.png
            packaging-install.log
