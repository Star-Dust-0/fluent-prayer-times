name: Prayer reconstruction verification (branch only)
on:
  push:
    branches: [reverse-engineered-v1.3.6]
    paths: ['reconstruction/**', '.github/workflows/prayer-reconstruction-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private original fixture
        uses: actions/checkout@v4
        with:
          ref: fixtures
          path: fixture-input
      - name: Verify and extract original fixture
        shell: pwsh
        run: |
          $archive = 'fixture-input/test-fixtures/FluentPrayerTimes-1.3.6-original.rar'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '845999cf1190566b685dbc6b19f558c394b855cc857af22d9bb3f8a619c78fba') { throw 'Fixture hash mismatch' }
          & 7z x $archive '-oreference' -y
          if ($LASTEXITCODE -ne 0) { throw 'Fixture extraction failed' }
          Copy-Item reference/FluentPrayerTimes-SelfContained/Audio reconstruction/native/Audio -Recurse -Force
          Copy-Item reference/FluentPrayerTimes-SelfContained/tray*.ico reconstruction/native/ -Force
          Copy-Item reference/FluentPrayerTimes-SelfContained/logo.png reconstruction/native/ -Force
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Regenerate native source
        run: python reconstruction/native/prepare-source.py
      - name: Build editable native WinUI source
        shell: pwsh
        run: |
          Push-Location reconstruction/native
          dotnet --version
          msbuild FluentPrayerTimes.csproj /restore /t:Publish /p:Configuration=Release /p:RuntimeIdentifier=win-x64 /p:Platform=x64 /p:PublishDir=../../verification-output/native/ /v:minimal 2>&1 | Tee-Object ../../native-build.log
          $buildCode = $LASTEXITCODE
          Pop-Location
          if ($buildCode -ne 0) { throw 'Native source build failed' }
      - name: Build managed recovery with original connectors
        shell: pwsh
        run: |
          dotnet build reconstruction/src/FluentPrayerTimes.csproj -p:OriginalAppDir="$pwd/reference/FluentPrayerTimes-SelfContained" -v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Managed recovery build failed' }
          Copy-Item reference/FluentPrayerTimes-SelfContained verification-output/recovered -Recurse -Force
          Copy-Item reconstruction/src/bin/Debug/netcoreapp8.0/FluentPrayerTimes.dll verification-output/recovered/FluentPrayerTimes.dll -Force
      - name: Isolate generated PRI from native code
        shell: pwsh
        run: |
          Copy-Item verification-output/native verification-output/native-original-pri -Recurse -Force
          Copy-Item reference/FluentPrayerTimes-SelfContained/resources.pri verification-output/native-original-pri/resources.pri -Force
      - name: Compare native original and rebuilt screen launches
        shell: pwsh
        run: ./reconstruction/verification/windows-parity.ps1
      - name: Save build logs and native output (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prayer-native-verification
          retention-days: 7
          path: |
            native-build.log
            verification-output/launch-results.json
            verification-output/screenshots/
            verification-output/*.log
            verification-output/native/
            reconstruction/native/obj/**/output.json
